    fallback: null
  custom_agents:
    status: verified_doc
    native_mechanism: ".qoder/agents/*.md, ~/.qoder/agents/*.md, --agents JSON; frontmatter name/description/tools/disallowedTools/model/permissionMode/maxTurns/timeoutMins/isolation/background/hooks/mcpServers"
