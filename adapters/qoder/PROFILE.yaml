    status: verified_doc
    native_mechanism: "qoder -p \"...\"; --agent <name>; cli/run-in-scripts, cli/loop, Agent SDK"
    evidence: "https://docs.qoder.com/cli/subagent"
    fallback: null
  context_isolation:
