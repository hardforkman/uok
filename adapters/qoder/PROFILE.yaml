    native_mechanism: "permissionMode: default/acceptEdits/bypassPermissions/dontAsk/auto/plan; global permission config"
    evidence: "https://docs.qoder.com/cli/subagent ; /cli/permissions"
    fallback: null
  mcp:
    status: verified_doc
