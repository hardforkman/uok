    status: verified_doc
    native_mechanism: "model frontmatter: inherit/auto/lite/efficient/performance or model name"
    evidence: "https://docs.qoder.com/cli/subagent"
    fallback: null
  parallel_dispatch:
    status: verified_doc
    native_mechanism: "independent subagents dispatched in parallel"
    evidence: "https://docs.qoder.com/cli/subagent"
    fallback: null
  background_execution:
    status: verified_doc
    native_mechanism: "background: true (feature must be enabled); completion notification"
