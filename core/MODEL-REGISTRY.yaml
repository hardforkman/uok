# Universal Model Registry
# Kit version: 1.0.0 · Spec version: 1.0.0 · Requirements: RT-04, RT-05, ARCH-02
#
# HONESTY RULES (normative):
# - availability: unknown | unverified | verified_available | unavailable
# - Any capability or cost that has not been confirmed MUST be "unknown".
# - Entries below marked `example: true` are ILLUSTRATIVE registry entries.
#   Their existence/capabilities/pricing are NOT confirmed by this kit; verify
#   against the provider in YOUR environment before use (see MODEL-CONFIG.yaml).
# - `test_only: true` entries are deterministic fixtures for the reference
#   kernel's behavior tests. They are not real endpoints. Never route real
#   work to them.
# - Credentials are referenced by environment-variable NAME only (SEC-02).
#   Never put keys, tokens, or passwords in this file.
schema_version: 1
registry_version: 1.0.0

providers:
  anthropic:
    kind: hosted_api
    auth_env: ANTHROPIC_API_KEY        # name of env var; value never stored here
    status: unverified
  openai:
    kind: hosted_api
    auth_env: OPENAI_API_KEY
    status: unverified
  google:
    kind: hosted_api
    auth_env: GEMINI_API_KEY
    status: unverified
  local:
    kind: openai_compatible_endpoint
    base_url_env: LOCAL_MODEL_BASE_URL
    auth_env: LOCAL_MODEL_API_KEY      # may be unused by local servers
    status: unverified
  mock:
    kind: test_fixture
    status: verified_local             # exists only inside validation tests

